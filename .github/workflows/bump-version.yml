name: Bump application version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine whether to bump version
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA="$(git rev-list --max-parents=0 "$AFTER_SHA")"
          fi

          should_bump=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              .github/workflows/bump-version.yml|scripts/bump-version*.test.mjs)
                ;;
              *.md)
                if [[ "$path" == */* ]]; then
                  should_bump=true
                  break
                fi
                ;;
              *)
                should_bump=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")

          echo "should-bump=$should_bump" >> "$GITHUB_OUTPUT"

      - name: Increment version
        if: steps.changes.outputs.should-bump == 'true'
        id: bump
        run: node scripts/bump-version.mjs

      - name: Commit version
        if: steps.changes.outputs.should-bump == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/version.ts
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Synchronize dev
        shell: bash
        run: |
          git fetch origin dev
          git merge-base --is-ancestor origin/dev HEAD
          git push origin HEAD:dev
